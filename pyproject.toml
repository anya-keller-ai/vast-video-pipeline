[project]
name = "vast-video-pipeline"
version = "0.1.0"
description = "Reference-based video restoration helpers for a Vast.ai ComfyUI runtime"
requires-python = ">=3.12"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
# The workbench tests (web/backend) need aiohttp and run via unittest.
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

# These modules exist only inside the ComfyUI runtime, not in CI.
[[tool.mypy.overrides]]
module = ["folder_paths", "torch"]
ignore_missing_imports = true
